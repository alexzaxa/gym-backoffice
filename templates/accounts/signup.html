{% extends "base.html" %}
{% block title %}Sign up your gym{% endblock %}
{% block content %}
<div class="card form-card">
  <h1>Sign up your gym</h1>
  <p class="help">You'll be the owner and can add front desk logins later.</p>
  <form method="post">
    {% csrf_token %}
    {% include "_form_fields.html" %}
    <button class="btn btn-full">Create gym</button>
  </form>
  <p class="center">Already set up? <a href="{% url 'login' %}">Log in</a></p>
</div>
{% endblock %}
