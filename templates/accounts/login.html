{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="card form-card narrow">
  <h1>Log in</h1>
  <form method="post">
    {% csrf_token %}
    {% include "_form_fields.html" %}
    <button class="btn btn-full">Log in</button>
  </form>
  <p class="center">New gym? <a href="{% url 'signup' %}">Sign up</a></p>
</div>
{% endblock %}
