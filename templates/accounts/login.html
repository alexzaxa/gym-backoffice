{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="mx-auto max-w-sm rounded-lg bg-white p-6 shadow">
  <h1 class="mb-4 text-xl font-semibold">Log in</h1>
  <form method="post">
    {% csrf_token %}
    {% include "_form_fields.html" %}
    <button class="btn w-full">Log in</button>
  </form>
  <p class="mt-4 text-center text-sm">New gym? <a href="{% url 'signup' %}" class="text-indigo-600">Sign up</a></p>
</div>
{% endblock %}
