{% extends "base.html" %}
{% block title %}{% if object %}Edit {{ object.full_name }}{% else %}Add member{% endif %}{% endblock %}
{% block content %}
<div class="mx-auto max-w-lg rounded-lg bg-white p-6 shadow">
  <h1 class="mb-4 text-xl font-semibold">{% if object %}Edit {{ object.full_name }}{% else %}Add member{% endif %}</h1>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {% include "_form_fields.html" %}
    <div class="flex gap-2">
      <button class="btn">Save</button>
      <a href="{% if object %}{% url 'members:detail' object.pk %}{% else %}{% url 'members:list' %}{% endif %}" class="btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
