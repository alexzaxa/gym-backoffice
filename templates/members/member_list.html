{% extends "base.html" %}
{% block title %}Members{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>Members</h1>
  </div>
  <a href="{% url 'members:create' %}" class="btn">Add member</a>
</div>
<div class="stats">
  {% for label, count in status_counts %}<div class="stat"><b>{{ count }}</b><small>{{ label }}</small></div>{% endfor %}
</div>
<form class="filters"
      hx-get="{% url 'members:list' %}" hx-target="#member-table" hx-trigger="input changed delay:250ms from:input, change from:select" hx-push-url="true">
  <input type="search" name="q" value="{{ q }}" placeholder="Search by name, email, phone or code" aria-label="Search members" autofocus>
  <select name="status" aria-label="Filter by status">
    <option value="">All statuses</option>
    {% for value, label in statuses %}<option value="{{ value }}" {% if value == status %}selected{% endif %}>{{ label }}</option>{% endfor %}
  </select>
</form>
<div id="member-table">{% include "members/_member_table.html" %}</div>
{% endblock %}
